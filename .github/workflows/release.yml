name: Release

# Publie sur npm avec une declaration de provenance. n8n refuse de verifier un
# community node publie depuis une machine locale : la 0.1.0 est partie comme ca
# et n'a pas d'attestations sur le registre.
#
# Authentification par trusted publishing (OIDC), donc aucun token stocke.
# A configurer une fois sur npmjs.com, page du package, Settings, Trusted Publisher :
#   provider = GitHub Actions
#   organization/user = guillaume-flambard
#   repository        = n8n-nodes-opn
#   workflow filename = release.yml
#
# Pourquoi pas un NPM_TOKEN : npm restreint les tokens qui contournent la 2FA
# (comptes en aout 2026, publication directe en janvier 2027), et un token sans
# bypass echoue en CI faute de quelqu'un pour saisir l'OTP.
#
# Declenchement : pousser un tag de version.
#   npm version patch && git push --follow-tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Sans id-token: write, npm ne peut pas signer la provenance et
      # --provenance echoue.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 embarque npm 10, et le trusted publishing par OIDC demande
      # npm 11.5.1 au minimum.
      - run: npm install -g npm@latest

      # Meme raison que dans ci.yml : isolated-vm est une devDep transitive au
      # build natif capricieux, et aucun script n'est necessaire ici.
      - run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm test

      # dist n'est pas versionne et `files` ne publie que dist, donc le build
      # doit tourner avant publish sinon le tarball part vide.
      - run: npm run build

      # Uniquement sur un tag : en workflow_dispatch, GITHUB_REF_NAME vaut le nom
      # de branche et la comparaison echouerait toujours.
      - name: Verifier que le tag correspond a la version du package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG et package.json $PKG divergent."
            exit 1
          fi

      # Pas de NODE_AUTH_TOKEN : l'authentification passe par l'OIDC ci-dessus.
      - run: npm publish --provenance --access public
